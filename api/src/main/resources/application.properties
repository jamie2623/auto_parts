server.port=8080

# Base de datos H2 en archivo (se conserva entre reinicios gracias al volumen de Docker)
spring.datasource.url=jdbc:h2:file:${DATA_DIR:./data}/autoparts;AUTO_SERVER=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Carpeta donde se guardan las fotos; se sirven en /images/{foto}
app.images-dir=${IMAGES_DIR:./data/images}

# Limite de subida: una foto de telefono suele pasar de 1 MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
